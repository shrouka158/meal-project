<div class="contact-sec p-5">
  <div class="container">
    <div class="porto-title text-center pt-3">
      <h1 class="fw-bold fs-1">CONTACT COMPONENT</h1>
      <div class="icon">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          fill="rgb(44, 62, 80)"
          class="bi bi-star-fill"
          viewBox="0 0 16 16"
        >
          <path
            d="M3.612 15.443c-.386.198-.824-.149-.746-.592l.83-4.73L.173 6.765c-.329-.314-.158-.888.283-.95l4.898-.696L7.538.792c.197-.39.73-.39.927 0l2.184 4.327 4.898.696c.441.062.612.636.282.95l-3.522 3.356.83 4.73c.078.443-.36.79-.746.592L8 13.187l-4.389 2.256z"
          />
        </svg>
      </div>
    </div>
    <section class="w-50 m-auto">
      <form>
        <div class="mb-3">
          @if (onTypeMode1) {
          <label for="exampleInputName" class="form-label">user Name</label>
          }
          <input
            type="text"
            class="form-control"
            id="exampleInputName"
            placeholder="user Name"
            (keypress)="label1()"
          />
        </div>
        <div class="mb-3">
          @if (onTypeMode2) {
          <label for="exampleInputAge" class="form-label">user Age</label>
          }
          <input
            type="number"
            class="form-control"
            id="exampleInputAge"
            placeholder="user Age"
            (keydown)="label2()"
          />
        </div>
        <div class="mb-3">
          @if (onTypeMode3) {
          <label for="exampleInputEmail1" class="form-label">user Email</label>
          }
          <input
            type="email"
            class="form-control"
            id="exampleInputEmail1"
            placeholder="user Email"
            (keydown)="label3()"
          />
        </div>
        <div class="mb-3">
          @if (onTypeMode4) {
          <label for="exampleInputPassword1" class="form-label"
            >user Password</label
          >
          }
          <input
            type="password"
            class="form-control"
            id="exampleInputPassword1"
            placeholder="user Password"
            (keydown)="label4()"
          />
        </div>

        <button type="submit" class="btn btn-primary">Send message</button>
      </form>
    </section>
  </div>
</div>
